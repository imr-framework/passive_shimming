[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "passive-shimming"
version = "0.0.1"
description = "Tools for passive MRI shimming, shim-field simulation, optimization, and fabrication."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sairam Geethanath" }
]
keywords = [
    "MRI",
    "magnetic resonance imaging",
    "passive shimming",
    "low-field MRI",
    "magpylib",
    "shim optimization",
    "3D printing",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "magpylib>=5.0",
    "pymoo>=0.6.1.3,<0.7",
    "trimesh>=4.4",
    "shapely>=2.0",
    "numpy-stl>=3.1",
    "manifold3d>=3.0",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4",
    "ipykernel>=6",
]
test = [
    "pytest>=8",
]
dev = [
    "build>=1.2",
    "twine>=5",
    "pytest>=8",
    "jupyterlab>=4",
    "ipykernel>=6",
]

[project.urls]
Homepage = "https://github.com/imr-framework/passive_shimming"
Repository = "https://github.com/imr-framework/passive_shimming"
Issues = "https://github.com/imr-framework/passive_shimming/issues"

[tool.setuptools]
py-modules = [
    "shimming_io",
    "shimming_geometry",
    "shimming_basis",
    "shimming_optimization",
    "shimming_reporting",
    "shimming_export",
    "make_shim_rings",
    "utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
